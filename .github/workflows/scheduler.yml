# Scheduler de publicaciones: llama al backend cada 5 minutos (mínimo de GitHub Actions; puede retrasarse unos minutos).
# Si necesitas precisión al minuto, usa un cron externo (p. ej. cron-job.org) contra la misma URL, o Vercel Cron en plan Pro.
# Secretos del repositorio necesarios: CALENDAPP_URL (p. ej. https://tu-app.vercel.app) y CRON_SECRET (el mismo valor que en Vercel).
name: scheduler
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: scheduler
  cancel-in-progress: false
jobs:
  publish-due:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publicar lo programado
        env:
          URL: ${{ secrets.CALENDAPP_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$URL" && test -n "$SECRET" || { echo "Faltan los secretos CALENDAPP_URL y CRON_SECRET"; exit 1; }
          curl --fail-with-body -sS -m 120 -H "Authorization: Bearer $SECRET" "$URL/api/cron?job=publish"
