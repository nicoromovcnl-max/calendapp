<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>smalletters — mascota final</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f1e8d8;
        --surface: #f6efe1;
        --ink: #282828;
        --muted: #5c6570;
        --accent: #1a3faa;
        --accent-mid: #2a4fc4;
        color-scheme: light;
      }
      :root[data-theme="night"] {
        --bg: #14171c;
        --surface: #1d2128;
        --ink: #ece7dc;
        --muted: #8b929c;
        --accent: #4a72e6;
        --accent-mid: #6c8ef2;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--bg);
        transition: background-color 1.1s ease;
      }
      canvas {
        display: block; width: 100%; height: 100%; cursor: pointer;
        touch-action: none; -webkit-touch-callout: none; user-select: none;
      }
      .topbar {
        position: fixed; top: max(1rem, env(safe-area-inset-top)); right: max(1rem, env(safe-area-inset-right));
        z-index: 4; display: flex; align-items: center; gap: 0.15rem;
        padding: 0.35rem; border-radius: 999px;
        background: color-mix(in srgb, var(--surface) 55%, transparent);
        backdrop-filter: blur(10px);
      }
      .theme-toggle {
        appearance: none; border: none; background: transparent; color: var(--muted);
        width: 1.9rem; height: 1.9rem; display: inline-flex; align-items: center; justify-content: center;
        border-radius: 50%; cursor: pointer;
        transition: background 0.3s ease, color 0.3s ease, transform 0.3s ease;
      }
      .theme-toggle:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
      .theme-toggle svg { width: 15px; height: 15px; transition: opacity 0.28s ease, transform 0.28s ease; }
      .theme-toggle[aria-pressed="true"] { color: var(--accent-mid); }
      .theme-toggle:disabled { opacity: 0.32; cursor: default; pointer-events: none; }
      .theme-toggle svg.icon-swap { opacity: 0; transform: scale(0.75) rotate(-15deg); }
      .zoom-label {
        font-size: 0.62rem; letter-spacing: 0.06em; color: var(--muted);
        min-width: 2rem; text-align: center; user-select: none;
      }
      .smallie-badge {
        position: fixed;
        top: max(1rem, env(safe-area-inset-top));
        left: max(1rem, env(safe-area-inset-left));
        z-index: 4;
        display: flex; flex-direction: column; gap: 0.12rem;
        padding: 0.55rem 0.85rem 0.62rem;
        border-radius: 1rem 1.2rem 1.2rem 0.45rem;
        background: color-mix(in srgb, var(--surface) 62%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent-mid) 22%, transparent);
        backdrop-filter: blur(10px);
        pointer-events: none;
        box-shadow: 0 8px 28px color-mix(in srgb, var(--accent) 8%, transparent);
      }
      .smallie-badge__name {
        font-size: 1.05rem; font-weight: 500; letter-spacing: 0.01em;
        color: var(--accent);
        line-height: 1.1;
      }
      .smallie-badge__hint {
        font-size: 0.68rem; color: var(--muted); letter-spacing: 0.04em;
      }
      .hud {
        position: fixed; left: max(1rem, env(safe-area-inset-left)); bottom: max(1rem, env(safe-area-inset-bottom));
        font-size: 0.74rem; opacity: 0.55; pointer-events: none; max-width: 28rem;
        color: var(--muted); line-height: 1.55; z-index: 2;
      }
      .moods {
        position: fixed; right: max(1rem, env(safe-area-inset-right)); bottom: max(1rem, env(safe-area-inset-bottom));
        display: flex; flex-wrap: wrap; gap: 0.35rem; z-index: 3; max-width: 34rem; justify-content: flex-end;
      }
      .moods button {
        font: inherit; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
        padding: 0.42rem 0.62rem; border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
        background: color-mix(in srgb, var(--surface) 70%, transparent);
        color: var(--ink); cursor: pointer; backdrop-filter: blur(8px);
        transition: transform 0.15s, border-color 0.15s, background 0.15s, color 0.15s;
      }
      .moods button:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent-mid) 45%, transparent); }
      .moods button.on {
        background: color-mix(in srgb, var(--accent-mid) 16%, transparent);
        border-color: color-mix(in srgb, var(--accent-mid) 55%, transparent);
        color: var(--accent);
      }
      .state-tag {
        position: fixed; left: 50%; bottom: max(1rem, env(safe-area-inset-bottom)); transform: translateX(-50%);
        font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
        opacity: 0.45; pointer-events: none; z-index: 2; color: var(--muted);
      }
      .bubble-pick {
        position: fixed;
        left: 50%;
        top: max(1rem, env(safe-area-inset-top));
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 0.28rem;
        padding: 0.32rem 0.38rem;
        border-radius: 999px;
        background: color-mix(in srgb, var(--surface) 58%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent-mid) 18%, transparent);
        backdrop-filter: blur(10px);
        box-shadow: 0 6px 22px color-mix(in srgb, var(--accent) 6%, transparent);
      }
      .bubble-pick__label {
        font-size: 0.58rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 0.2rem 0 0.35rem;
        user-select: none;
      }
      .bubble-pick button {
        font: inherit;
        font-size: 0.62rem;
        letter-spacing: 0.04em;
        padding: 0.34rem 0.58rem;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
        background: color-mix(in srgb, var(--surface) 72%, transparent);
        color: var(--muted);
        cursor: pointer;
        transition: transform 0.15s, border-color 0.15s, background 0.15s, color 0.15s;
      }
      .bubble-pick button:hover {
        transform: translateY(-1px);
        border-color: color-mix(in srgb, var(--accent-mid) 40%, transparent);
        color: var(--ink);
      }
      .bubble-pick button.on {
        background: color-mix(in srgb, var(--accent-mid) 16%, transparent);
        border-color: color-mix(in srgb, var(--accent-mid) 50%, transparent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="smallie-badge" aria-hidden="true">
      <span class="smallie-badge__name">Smallie</span>
      <span class="smallie-badge__hint">✦ aquí contigo</span>
    </div>
    <div class="topbar">
      <button type="button" class="theme-toggle" id="zoom-out" aria-label="Alejar a Smallie" title="Alejar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.2" /><path d="M16 16l4.5 4.5M8.2 11h5.6" />
        </svg>
      </button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button type="button" class="theme-toggle" id="zoom-in" aria-label="Acercar a Smallie" title="Acercar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.2" /><path d="M16 16l4.5 4.5M11 8.2v5.6M8.2 11h5.6" />
        </svg>
      </button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Cambiar a modo noche" title="Modo día / noche">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 3v2M12 19v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M3 12h2M19 12h2M4.6 19.4l1.4-1.4M18 6l1.4-1.4" />
        </svg>
      </button>
    </div>
    <div class="bubble-pick" id="bubblePick" aria-label="Estilo de bocadillo">
      <span class="bubble-pick__label">bocadillo</span>
      <button type="button" data-b="0" class="on">Clásico</button>
      <button type="button" data-b="1">Suave</button>
      <button type="button" data-b="2">Línea</button>
    </div>
    <p class="hud">Toca para ir · doble toque para ir corriendo feliz</p>
    <p class="state-tag" id="stateTag">reposo</p>
    <div class="moods">
      <button type="button" data-m="idle">Reposo</button>
      <button type="button" data-m="happy">Feliz</button>
      <button type="button" data-m="curious">Curiosa</button>
      <button type="button" data-m="excited">Emocionada</button>
      <button type="button" data-m="float">Flotando</button>
      <button type="button" data-m="sleepy">Soñolienta</button>
      <button type="button" data-m="chatty">Habla</button>
      <button type="button" data-m="shy">Tímida</button>
      <button type="button" data-m="wiggle">Ondas</button>
      <button type="button" data-m="spin">Giro</button>
      <button type="button" data-m="color">Color</button>
    </div>
    <script>
      (function () {
        var canvas = document.getElementById("c");
        var ctx = canvas.getContext("2d", { alpha: false });

        var W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2);
        var orbX = 0, orbY = 0, targetX = 0, targetY = 0;
        var velX = 0, velY = 0, moveVelX = 0, moveVelY = 0;
        var lookX = 0, lookY = 0, lastNow = 0, ready = false;
        var ZOOM_LEVELS = [0.8, 1, 1.35, 1.7, 2.1];
        var ZOOM_KEY = "smalletters-zoom";
        var zoom = { index: 1, level: 1 };
        var bgCanvas = null, bgCtx = null, bgDirty = true;
        var smoothLX = 0, smoothLY = 0, mouthOpen = 0;
        var trail = [], TRAIL = 38, trailIdle = 0, trailPhase = 0;
        var depart = { active: false, t: 0, dur: 1.35, nx: 0, ny: 0 };
        var COLOR_INT = 1.48;
        var mood = {
          id: "idle", t: 0, spin: 0, spinAngle: 0, spinVel: 0, spinFast: 0,
          color: 0, bounce: 0, squash: 1, wiggleX: 0, shrink: 1,
        };
        var MAX_SPEED = 28;
        var RUN_SPEED = 680;
        var GO_SPEED = 240;
        var MIN_EYE = 0.58;
        var MIN_MOUTH = 0.62;
        var wander = { x: 0, y: 0, nextPick: 0, ready: true };
        var committee = { timer: 0, last: null, gap: 7 };
        var userOverride = 0, colorBlend = 0, lastOrbR = 24, happyRun = 0;
        var runTap = { x: 0, y: 0, t: 0, pending: null, lastEv: 0 };
        var DOUBLE_TAP_MS = 340;
        var DOUBLE_TAP_DIST = 56;
        var POINTER_DEBOUNCE_MS = 45;
        var stateTag = document.getElementById("stateTag");
        var moodBtns = [].slice.call(document.querySelectorAll(".moods button"));
        var bubbleBtns = [].slice.call(document.querySelectorAll(".bubble-pick button"));
        var MOOD_DUR = {
          idle: 9999, happy: 4.2, spin: 4.6, color: 5,
          curious: 6, excited: 3.8, float: 7, sleepy: 6.5, shy: 4.5, wiggle: 4, chatty: 4.8,
        };
        var MOOD_LABEL = {
          idle: "reposo", happy: "feliz", spin: "giro 3d", color: "color",
          curious: "curiosa", excited: "alegre", float: "flotando", sleepy: "soñolienta",
          shy: "tímida", wiggle: "ondulando", chatty: "hablando",
        };
        var COMMITTEE = [
          { id: "chatty", w: 17 }, { id: "happy", w: 16 }, { id: "curious", w: 15 },
          { id: "float", w: 14 }, { id: "excited", w: 12 }, { id: "spin", w: 11 },
          { id: "wiggle", w: 10 }, { id: "color", w: 10 }, { id: "sleepy", w: 9 },
          { id: "shy", w: 9 }, { id: "idle", w: 5 },
        ];
        var SPEECH = {
          idle: ["¿alguien me mira?", "modo planta 🌱", "hm… ¿snack?", "solo existo ✦"],
          happy: ["vida orbosa", "jejeje ✦", "soy una bolita feliz", "esto mola"],
          excited: ["¡WHEEE!", "a tope!", "¿otra vez?", "adrenalina orb"],
          curious: ["¿y eso qué es?", "che, mira", "mmm interesante", "modo detective"],
          float: ["gravedad, no", "flotando en paz", "eee~ nube", "cero estrés"],
          sleepy: ["5 min más…", "zzz orb", "medio despierta", "shhh…"],
          chatty: ["te cuento un chisme", "escucha esto", "tengo una teoría", "¿sabías que…?", "dato orb random"],
          shy: ["eh… holi", "me da vergüita", "solo pasaba", "ups… hola"],
          wiggle: ["tirititi~", "modo gelatina", "uiui~", "tembleque pro"],
          spin: ["giro pro", "tornado mini", "wheee~", "360 no scope"],
          color: ["look neon ✦", "brillo mode ON", "arcoíris interno", "glow up"],
          run: ["¡PIUU!", "tengo prisa", "modo cohete", "el suelo tiembla (yo no)"],
          tap: ["ok ok voy", "entendido jefe", "recibido ✦", "a la orden"],
          arrive: ["ta dan!", "llegué sin perderme", "misión cumplida", "aquí estoy otra vez"],
        };
        var bubble = { active: false, text: "", t: 0, dur: 3, show: 0 };
        var BUBBLE_STYLE_KEY = "smalletters-bubble-style";
        var bubbleStyle = 0;
        var BUBBLE_STYLE_NAMES = ["Clásico", "Suave", "Línea"];
        var presence = { timer: 0, gap: 11, lastLine: "", lastArrive: 0, atDest: false };
        var FACE_SCALE = 1.1;
        var BRAND = { deep: [12, 38, 210], mid: [24, 62, 245], bright: [48, 95, 255], glow: [170, 205, 255] };
        var COLOR_PRESETS = [
          BRAND,
          { deep: [18, 108, 148], mid: [34, 150, 190], bright: [70, 190, 230], glow: [160, 225, 255] },
          { deep: [72, 48, 168], mid: [102, 72, 210], bright: [140, 105, 245], glow: [205, 185, 255] },
          { deep: [22, 120, 108], mid: [38, 165, 142], bright: [68, 205, 175], glow: [175, 240, 220] },
          { deep: [120, 52, 138], mid: [165, 72, 175], bright: [210, 105, 210], glow: [245, 190, 245] },
        ];

        function lerp(a, b, t) { return a + (b - a) * t; }
        function lerpRgb(a, b, t) {
          return [
            Math.round(lerp(a[0], b[0], t)),
            Math.round(lerp(a[1], b[1], t)),
            Math.round(lerp(a[2], b[2], t)),
          ];
        }
        function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + Math.min(1, a) + ")"; }
        function intense(c, a) { return rgba(c, a * COLOR_INT); }

        function departLight(t) {
          if (t >= 0.72) return lerp(0.45, 1, smoothstep(0.72, 1, t));
          var f1 = Math.sin(t * 42) * 0.5 + 0.5;
          var f2 = Math.sin(t * 27 + 1.4) * 0.5 + 0.5;
          return 0.28 + f1 * f2 * 0.62;
        }

        function computeWanderPoint(near) {
          var b = orbBounds(lastOrbR);
          if (near) {
            var ang = Math.random() * Math.PI * 2;
            var dist = 45 + Math.random() * Math.min(W, H) * 0.1;
            return clampPoint(
              orbX + Math.cos(ang) * dist,
              orbY + Math.sin(ang) * dist,
              lastOrbR,
            );
          }
          return clampPoint(
            b.minX + Math.random() * (b.maxX - b.minX),
            b.minY + Math.random() * (b.maxY - b.minY),
            lastOrbR,
          );
        }

        function beginDepart(near) {
          var p = computeWanderPoint(near);
          depart.nx = p.x;
          depart.ny = p.y;
          depart.active = true;
          depart.t = 0;
        }

        function finishDepart(sec) {
          wander.x = depart.nx;
          wander.y = depart.ny;
          wander.nextPick = sec + 11 + Math.random() * 14;
          depart.active = false;
          depart.t = 0;
        }

        function paletteAt(phase) {
          var n = COLOR_PRESETS.length;
          var f = ((phase % 1) + 1) % 1 * n;
          var i = Math.floor(f) % n;
          var j = (i + 1) % n;
          var t = f - Math.floor(f);
          return {
            deep: lerpRgb(COLOR_PRESETS[i].deep, COLOR_PRESETS[j].deep, t),
            mid: lerpRgb(COLOR_PRESETS[i].mid, COLOR_PRESETS[j].mid, t),
            bright: lerpRgb(COLOR_PRESETS[i].bright, COLOR_PRESETS[j].bright, t),
            glow: lerpRgb(COLOR_PRESETS[i].glow, COLOR_PRESETS[j].glow, t),
          };
        }

        function setMood(id) {
          mood.id = id;
          mood.t = 0;
          if (id === "spin") {
            mood.spin = 0;
            mood.spinAngle = 0;
            mood.spinVel = 0;
            mood.spinFast = 0;
          }
          resetMoodFx();
          moodBtns.forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-m") === id); });
          if (stateTag) stateTag.textContent = MOOD_LABEL[id] || id;
        }

        function orbBounds(r) {
          r = r || lastOrbR || Math.min(W, H) * 0.018;
          var pad = Math.min(W, H) * 0.045;
          return {
            minX: r * 1.45 + pad,
            maxX: W - r * 1.45 - pad,
            minY: r * 2.4 + pad + Math.min(W, H) * 0.06,
            maxY: H - r * 1.7 - pad - Math.min(W, H) * 0.1,
          };
        }

        function clampPoint(x, y, r) {
          var b = orbBounds(r);
          return {
            x: Math.max(b.minX, Math.min(b.maxX, x)),
            y: Math.max(b.minY, Math.min(b.maxY, y)),
          };
        }

        function clampOrbPos(r) {
          var p = clampPoint(orbX, orbY, r);
          orbX = p.x;
          orbY = p.y;
        }

        function wanderMargin() {
          var b = orbBounds(lastOrbR);
          return Math.min(b.minX, b.minY, W - b.maxX, H - b.maxY);
        }

        function pickWanderTarget(sec, near, instant) {
          if (instant || !wander.ready) {
            var p = computeWanderPoint(near);
            wander.x = p.x;
            wander.y = p.y;
            wander.nextPick = sec + 11 + Math.random() * 14;
            wander.ready = true;
            return;
          }
          if (!depart.active) beginDepart(near);
        }

        function pickSpeechLine(key) {
          var pool = SPEECH[key] || SPEECH.idle;
          if (!pool.length) return "";
          var line = pool[Math.floor(Math.random() * pool.length)];
          if (line === presence.lastLine && pool.length > 1) {
            line = pool[(Math.floor(Math.random() * pool.length) + 1) % pool.length];
          }
          presence.lastLine = line;
          return line;
        }

        function setBubbleStyle(idx, preview) {
          idx = Math.max(0, Math.min(BUBBLE_STYLE_NAMES.length - 1, idx | 0));
          bubbleStyle = idx;
          bubbleBtns.forEach(function (b) {
            b.classList.toggle("on", parseInt(b.getAttribute("data-b"), 10) === idx);
          });
          try { localStorage.setItem(BUBBLE_STYLE_KEY, String(idx)); } catch (e) {}
          if (preview) {
            bubble.active = false;
            sayBubble("así me queda ✦", 2.8);
          }
        }

        function sayBubble(text, extraDur) {
          if (!text || bubble.active) return;
          bubble.text = text;
          bubble.active = true;
          bubble.t = 0;
          bubble.show = 0;
          bubble.dur = (extraDur || 2.9) + text.length * 0.11;
        }

        function springPop(t) {
          if (t >= 1) return 1;
          return 1 - Math.pow(1 - t, 2.6) * Math.cos(t * Math.PI * 0.55);
        }

        function updateBubble(dt) {
          if (!bubble.active) return;
          bubble.t += dt;
          if (bubble.t < 0.52) {
            bubble.show = springPop(bubble.t / 0.52);
          } else if (bubble.t > bubble.dur) {
            bubble.show = Math.max(0, bubble.show - dt * 2.4);
            if (bubble.show <= 0) {
              bubble.active = false;
              bubble.text = "";
            }
          } else {
            bubble.show = 1;
          }
        }

        function presenceThink(dt, sec) {
          updateBubble(dt);
          if (bubble.active || depart.active) return;
          presence.timer += dt;
          if (presence.timer < presence.gap) return;
          presence.timer = 0;
          presence.gap = 9 + Math.random() * 14;
          var chance = mood.id === "idle" ? 0.58 : mood.id === "chatty" ? 0.72 : 0.38;
          if (Math.random() < chance) {
            sayBubble(pickSpeechLine(mood.id === "idle" ? "idle" : mood.id));
          }
        }

        function committeeVote(sec) {
          var pool = COMMITTEE.filter(function (item) {
            return item.id !== committee.last || Math.random() < 0.25;
          });
          var total = 0;
          pool.forEach(function (item) { total += item.w; });
          var roll = Math.random() * total;
          for (var i = 0; i < pool.length; i++) {
            roll -= pool[i].w;
            if (roll <= 0) {
              committee.last = pool[i].id;
              setMood(pool[i].id);
              pickWanderTarget(sec, false, false);
              committee.timer = 0;
              committee.gap = 8 + Math.random() * 9;
              if (Math.random() < 0.52) {
                sayBubble(pickSpeechLine(pool[i].id), pool[i].id === "chatty" ? 1.4 : 0);
              }
              return;
            }
          }
        }

        function resetMoodFx() {
          mood.wiggleX = 0;
          mood.shrink = 1;
          if (mood.id !== "spin") {
            mood.spinVel = 0;
            mood.spinFast = 0;
          }
        }

        function updateMood(dt, sec) {
          mood.t += dt;
          if (mood.id === "idle") {
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 3);
            mood.bounce = 0;
            mood.squash = 1;
            resetMoodFx();
            committee.timer += dt;
            if (committee.timer >= committee.gap) committeeVote(sec);
            return;
          }
          committee.timer = 0;
          var p = mood.t / (MOOD_DUR[mood.id] || 3);

          if (mood.id === "happy") {
            if (happyRun > 0) {
              mood.bounce = 0;
              mood.squash = 1;
            } else {
              var hop = Math.abs(Math.sin(sec * 5.5));
              mood.bounce = hop * 0.14;
              mood.squash = 1 + (1 - hop) * 0.03 - hop * 0.02;
            }
            mood.shrink = 1;
            mood.wiggleX = 0;
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 4);
          } else if (mood.id === "excited") {
            var hop2 = Math.abs(Math.sin(sec * 6));
            mood.bounce = hop2 * 0.16;
            mood.squash = 1 + (1 - hop2) * 0.035 - hop2 * 0.02;
            mood.wiggleX = Math.sin(sec * 4) * 1.2;
            mood.shrink = 1;
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 4);
          } else if (mood.id === "curious") {
            mood.bounce = Math.sin(sec * 1.1) * 0.03;
            mood.squash = 1;
            mood.wiggleX = 0;
            mood.shrink = 1;
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 4);
          } else if (mood.id === "float") {
            mood.bounce = Math.sin(sec * 0.85) * 0.045;
            mood.squash = 1 + Math.sin(sec * 0.7) * 0.015;
            mood.wiggleX = 0;
            mood.shrink = 1;
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 3);
          } else if (mood.id === "sleepy") {
            mood.bounce = Math.sin(sec * 0.45) * 0.02;
            mood.squash = 1;
            mood.wiggleX = 0;
            mood.shrink = 0.98;
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 3);
          } else if (mood.id === "chatty") {
            mood.bounce = Math.sin(sec * 4) * 0.05;
            mood.squash = 1;
            mood.wiggleX = Math.sin(sec * 3.5) * 1.5;
            mood.shrink = 1;
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 4);
            if (mood.t > 0.6 && Math.floor(mood.t * 1.15) !== Math.floor((mood.t - dt) * 1.15)) {
              if (Math.random() < 0.55) sayBubble(pickSpeechLine("chatty"), 0.8);
            }
          } else if (mood.id === "shy") {
            mood.bounce = 0;
            mood.squash = 1;
            mood.wiggleX = Math.sin(sec * 1.4) * 0.8;
            mood.shrink = 0.96 + Math.sin(sec * 1.2) * 0.015;
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 4);
          } else if (mood.id === "wiggle") {
            mood.bounce = Math.sin(sec * 3.5) * 0.025;
            mood.squash = 1 + Math.sin(sec * 3.5) * 0.02;
            mood.wiggleX = Math.sin(sec * 2.8) * 4;
            mood.shrink = 1;
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 4);
          } else if (mood.id === "spin") {
            var targetVel = 0;
            if (p < 0.1) targetVel = lerp(0, 11, smoothstep(0, 0.1, p));
            else if (p < 0.82) targetVel = 10 + Math.sin(sec * 2.2) * 1.8;
            else targetVel = lerp(10, 0.3, smoothstep(0.82, 1, p));
            mood.spinVel += (targetVel - mood.spinVel) * Math.min(1, dt * 6);
            mood.spinAngle += mood.spinVel * dt;
            mood.spin = mood.spinAngle;
            mood.spinFast = smoothstep(1.5, 9, Math.abs(mood.spinVel));
            mood.bounce = 0;
            mood.squash = 1;
            mood.wiggleX = 0;
            mood.shrink = 1;
            colorBlend += (0 - colorBlend) * Math.min(1, dt * 4);
            if (stateTag) stateTag.textContent = MOOD_LABEL.spin;
          } else if (mood.id === "color") {
            mood.bounce = Math.sin(sec * 3.5) * 0.04;
            mood.squash = 1;
            mood.wiggleX = 0;
            mood.shrink = 1;
            colorBlend += (1 - colorBlend) * Math.min(1, dt * 2.5);
            mood.color = mood.t * 0.22;
          }

          if (mood.t >= (MOOD_DUR[mood.id] || 3)) committeeVote(sec);
        }

        function smoothstep(a, b, x) {
          var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        }

        function themeLm() {
          return document.documentElement.getAttribute("data-theme") === "night" ? 0 : 1;
        }

        function invalidateBackground() { bgDirty = true; }

        function paintBackground(g) {
          var night = themeLm() < 0.5;
          var grad = g.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.78);
          if (night) {
            grad.addColorStop(0, "#1a1f28");
            grad.addColorStop(0.55, "#14171c");
            grad.addColorStop(1, "#050608");
          } else {
            grad.addColorStop(0, "#f6efe1");
            grad.addColorStop(0.55, "#f1e8d8");
            grad.addColorStop(1, "#e8dfd0");
          }
          g.fillStyle = grad;
          g.fillRect(0, 0, W, H);
        }

        function drawBackground() {
          if (!bgCanvas || bgCanvas.width !== canvas.width || bgDirty) {
            if (!bgCanvas) {
              bgCanvas = document.createElement("canvas");
              bgCtx = bgCanvas.getContext("2d");
            }
            bgCanvas.width = canvas.width;
            bgCanvas.height = canvas.height;
            bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            paintBackground(bgCtx);
            bgDirty = false;
          }
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(bgCanvas, 0, 0);
          ctx.restore();
        }

        function roundRect(x, y, w, h, rad) {
          var rr = Math.min(rad, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.lineTo(x + w - rr, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
          ctx.lineTo(x + w, y + h - rr);
          ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
          ctx.lineTo(x + rr, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
          ctx.lineTo(x, y + rr);
          ctx.quadraticCurveTo(x, y, x + rr, y);
          ctx.closePath();
        }

        function blink(sec) {
          var p = sec % 5.8;
          if (p < 5.15) return 1;
          if (p < 5.32) return 1 - smoothstep(5.15, 5.32, p) * (1 - MIN_EYE);
          if (p < 5.48) return MIN_EYE;
          if (p < 5.65) return MIN_EYE + smoothstep(5.48, 5.65, p) * (1 - MIN_EYE);
          return 1;
        }

        function resize() {
          W = innerWidth; H = innerHeight;
          canvas.width = W * dpr; canvas.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (!ready) {
            orbX = W * 0.5; orbY = H * 0.5;
            targetX = orbX; targetY = orbY;
            wander.x = orbX; wander.y = orbY;
            ready = true;
          }
          clampOrbPos(lastOrbR);
          var cp = clampPoint(targetX, targetY, lastOrbR);
          targetX = cp.x; targetY = cp.y;
          var wp = clampPoint(wander.x, wander.y, lastOrbR);
          wander.x = wp.x; wander.y = wp.y;
        }
        addEventListener("resize", function () { resize(); invalidateBackground(); });
        resize();

        function sendSmallieTo(x, y, running) {
          var dest = clampPoint(x, y, lastOrbR);
          targetX = dest.x;
          targetY = dest.y;
          wander.x = dest.x;
          wander.y = dest.y;
          depart.active = false;
          userOverride = running ? 20 : 14;
          var tdx = x - orbX;
          var tdy = y - orbY;
          var td = Math.hypot(tdx, tdy) || 1;
          var kick = running ? RUN_SPEED * 0.72 : GO_SPEED * 0.5;
          var curSp = Math.hypot(moveVelX, moveVelY);
          var midRun = running && happyRun > 0 && curSp > RUN_SPEED * 0.3;
          if (midRun) {
            var blend = 0.28;
            moveVelX = moveVelX * (1 - blend) + (tdx / td) * kick * blend;
            moveVelY = moveVelY * (1 - blend) + (tdy / td) * kick * blend;
          } else {
            moveVelX = (tdx / td) * kick;
            moveVelY = (tdy / td) * kick;
          }
          happyRun = running ? 1 : 0;
          if (running) {
            trail.length = 0;
            trailPhase = 0;
            trailIdle = 0;
            sayBubble(pickSpeechLine("run"), 0.6);
          } else if (Math.random() < 0.35) {
            sayBubble(pickSpeechLine("tap"));
          }
          setMood(running ? "happy" : "idle");
          committee.timer = 0;
          if (stateTag) stateTag.textContent = running ? "¡corriendo!" : "yendo…";
        }

        function onCanvasTap(x, y) {
          var now = performance.now();
          if (runTap.pending) {
            clearTimeout(runTap.pending);
            runTap.pending = null;
          }
          if (now - runTap.t < DOUBLE_TAP_MS && Math.hypot(x - runTap.x, y - runTap.y) < DOUBLE_TAP_DIST) {
            runTap.t = 0;
            sendSmallieTo(x, y, true);
            return;
          }
          runTap.x = x;
          runTap.y = y;
          runTap.t = now;
          runTap.pending = setTimeout(function () {
            runTap.pending = null;
            sendSmallieTo(x, y, false);
          }, DOUBLE_TAP_MS);
        }

        canvas.addEventListener("pointerdown", function (e) {
          if (e.button !== 0) return;
          var now = performance.now();
          if (now - runTap.lastEv < POINTER_DEBOUNCE_MS) return;
          runTap.lastEv = now;
          if (e.pointerType === "touch") e.preventDefault();
          onCanvasTap(e.clientX, e.clientY);
        }, { passive: false });

        addEventListener("keydown", function (e) {
          var map = {
            "1": "happy", "2": "curious", "3": "excited", "4": "float",
            "5": "sleepy", "6": "chatty", "7": "shy", "8": "wiggle", "9": "spin", "0": "color",
          };
          if (map[e.key]) {
            setMood(map[e.key]);
            committee.timer = 0;
            e.preventDefault();
          }
        });
        moodBtns.forEach(function (b) {
          b.addEventListener("click", function () { setMood(b.getAttribute("data-m")); });
        });
        bubbleBtns.forEach(function (b) {
          b.addEventListener("click", function () {
            setBubbleStyle(parseInt(b.getAttribute("data-b"), 10), true);
          });
        });
        (function initBubbleStyle() {
          var saved = 0;
          try {
            var raw = localStorage.getItem(BUBBLE_STYLE_KEY);
            if (raw != null) saved = parseInt(raw, 10);
          } catch (e) {}
          if (isNaN(saved) || saved < 0 || saved >= BUBBLE_STYLE_NAMES.length) saved = 0;
          setBubbleStyle(saved, false);
        })();
        setMood("idle");
        pickWanderTarget(0, false, true);

        function sphereFacePoint(x0, y0, yaw, r) {
          var rr = r * r;
          var d2 = x0 * x0 + y0 * y0;
          if (d2 >= rr * 0.96) {
            var s = (r * 0.94) / Math.sqrt(d2);
            x0 *= s;
            y0 *= s;
            d2 = x0 * x0 + y0 * y0;
          }
          var z0 = Math.sqrt(rr - d2);
          var c = Math.cos(yaw), si = Math.sin(yaw);
          var x = x0 * c + z0 * si;
          var y = y0;
          var z = -x0 * si + z0 * c;
          var zn = z / r;
          var limb = Math.sqrt(Math.max(0, zn));
          return {
            x: x,
            y: y,
            sx: Math.max(0.06, limb),
            a: Math.max(0, Math.min(1, smoothstep(0.02, 0.32, zn))),
            visible: zn > 0.01,
            zr: z,
          };
        }

        function drawCapsuleEye(ex, ey, ew, eh, alpha, white) {
          ctx.save();
          ctx.globalAlpha = ctx.globalAlpha * alpha;
          var x = ex - ew / 2, y = ey - eh / 2;
          if (white) {
            ctx.save();
            roundRect(x - ew * 0.12, y - eh * 0.1, ew * 1.24, eh * 1.2, ew / 2);
            ctx.fillStyle = "rgba(140,180,255,0.28)"; ctx.fill();
            ctx.restore();
            ctx.save();
            roundRect(x, y, ew, eh, ew / 2);
            var glow = ctx.createLinearGradient(x, y, x, y + eh);
            glow.addColorStop(0, "rgba(255,255,255,0.98)");
            glow.addColorStop(1, "rgba(210,230,255,0.82)");
            ctx.fillStyle = glow; ctx.fill();
            ctx.restore();
          } else {
            ctx.save();
            roundRect(x - ew * 0.08, y - eh * 0.08, ew * 1.16, eh * 1.16, ew / 2);
            ctx.fillStyle = "rgba(2,6,18,0.35)"; ctx.fill(); ctx.restore();
            ctx.save();
            roundRect(x, y, ew, eh, ew / 2);
            var eg = ctx.createLinearGradient(x, y, x, y + eh);
            eg.addColorStop(0, "rgba(12,22,48,0.98)");
            eg.addColorStop(1, "rgba(6,12,30,0.95)");
            ctx.fillStyle = eg; ctx.fill(); ctx.restore();
          }
          ctx.restore();
        }

        function drawSpinFaceTrail(cx, cy, r, yaw, vel, lm, blink, speak, sec, col, lightMul) {
          if (Math.abs(vel) < 0.8) return;
          var power = smoothstep(1, 10, Math.abs(vel));
          var steps = 2 + Math.floor(power * 3);
          var dir = vel >= 0 ? 1 : -1;
          for (var g = steps; g >= 1; g--) {
            ctx.save();
            ctx.globalAlpha = lightMul * (0.05 + g * 0.07) * (0.5 + power * 0.4);
            drawFace(cx, cy, r, 0, 0, blink, lm, speak, "spin", sec, yaw - g * (0.12 + power * 0.1) * dir);
            ctx.restore();
          }
        }

        function drawMouth(cx, cy, r, lx, ly, bl, lm, open, happy, chatty, sleepy, scaleX, pinned) {
          scaleX = scaleX || 1;
          bl = Math.max(bl, MIN_MOUTH);
          var f = FACE_SCALE;
          var white = lm > 0.45;
          var mx = pinned ? cx : cx + lx * r * 0.14 * f;
          var my = pinned ? cy : cy + r * 0.31 + ly * r * 0.05 * f + (sleepy ? r * 0.02 * f : 0);
          var mw = r * (chatty ? 0.32 : happy ? 0.3 : 0.26) * f;
          var talk = Math.max(0, Math.min(1, chatty ? open : happy ? Math.max(open, 0.35) : open));

          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          ctx.translate(mx, my);
          ctx.scale(scaleX, 1);

          var stroke = white ? "rgba(255,255,255,0.88)" : "rgba(12,22,48,0.9)";
          var inner = white ? "rgba(255,255,255,0.95)" : "rgba(8,16,36,0.95)";
          var cavity = white ? "rgba(180,205,255,0.62)" : "rgba(2,6,18,0.65)";

          if (!chatty || talk < 0.35) {
            ctx.beginPath();
            ctx.lineCap = "round";
            ctx.lineWidth = Math.max(1.6, r * 0.058 * f);
            ctx.strokeStyle = stroke;
            var smileDrop = sleepy ? r * 0.01 * f : happy ? -r * 0.04 * f : -r * 0.02 * f;
            ctx.arc(0, smileDrop, mw * (sleepy ? 0.48 : happy ? 0.56 : 0.52), 0.08 * Math.PI, 0.92 * Math.PI);
            ctx.stroke();
          }

          if (talk > 0.1) {
            var jaw = (r * (chatty ? 0.025 : 0.015) + talk * r * (chatty ? 0.028 : 0.018)) * f;
            var oh = (r * (chatty ? 0.04 : 0.028) + talk * r * (chatty ? 0.16 : 0.11)) * f;
            var ow = mw * (chatty ? 0.52 + talk * 0.22 : 0.38 + talk * 0.14);

            ctx.save();
            ctx.beginPath();
            ctx.ellipse(0, jaw, ow * 1.22, oh * 1.28, 0, 0, Math.PI * 2);
            ctx.fillStyle = white ? "rgba(180,205,255,0.38)" : "rgba(2,6,18,0.38)";
            ctx.fill(); ctx.restore();

            ctx.beginPath();
            ctx.ellipse(0, jaw, ow, oh, 0, 0, Math.PI * 2);
            ctx.fillStyle = inner;
            ctx.fill();

            if (talk > 0.38) {
              ctx.beginPath();
              ctx.ellipse(0, jaw + oh * (chatty ? 0.42 : 0.35), ow * 0.58, oh * (chatty ? 0.42 : 0.35), 0, 0, Math.PI);
              ctx.fillStyle = white ? "rgba(220,235,255,0.75)" : "rgba(40,60,110,0.5)";
              ctx.fill();
            }
          }
          ctx.restore();
        }

        function drawZzz(cx, cy, r, sec, lm, sleepy) {
          if (!sleepy) return;
          var white = lm > 0.45;
          var chars = ["z", "Z", "z"];
          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          for (var i = 0; i < 3; i++) {
            var cycle = (sec * 0.55 + i * 0.85) % 1;
            var bx = cx + r * (0.18 + i * 0.14);
            var by = cy - r * (0.42 + i * 0.12) - cycle * r * 0.38;
            var size = r * (0.11 + i * 0.035);
            ctx.font = "500 " + size + "px DM Sans, system-ui, sans-serif";
            ctx.globalAlpha = (1 - cycle) * 0.75 + 0.2;
            ctx.fillStyle = white ? "rgba(210,230,255,0.85)" : "rgba(150,190,255,0.7)";
            ctx.fillText(chars[i], bx + Math.sin(sec * 1.2 + i) * r * 0.03, by);
          }
          ctx.restore();
        }

        function drawFace(cx, cy, r, lx, ly, bl, lm, speak, moodId, sec, faceYaw) {
          var f = FACE_SCALE;
          var happy = moodId === "happy" || moodId === "excited";
          var sleepy = moodId === "sleepy";
          var chatty = moodId === "chatty";
          var shy = moodId === "shy";
          var eyeBl = Math.max(bl, MIN_EYE);
          var sleepyClose = sleepy ? 0.22 + Math.abs(Math.sin(sec * 0.38)) * 0.38 : 1;
          if (sleepy) eyeBl = Math.max(MIN_EYE * 0.85, sleepyClose);
          var ew = r * 0.13 * f;
          var eh = Math.max(r * 0.045 * f, r * (happy ? 0.24 : sleepy ? 0.14 : 0.53) * eyeBl * f);
          if (shy) { ew *= 0.94; eh *= 0.92; }
          var gap = r * 0.39 * f;
          var faceY = cy - r * (sleepy ? 0.11 : 0.13);
          var shyOff = shy ? 0.22 : 0;
          var sx = (lx + shyOff) * r * 0.22 * f;
          var white = lm > 0.45;

          if (faceYaw != null) {
            ctx.save();
            ctx.globalCompositeOperation = "source-over";
            var faceY0 = -r * 0.13;
            var mouthX0 = lx * r * 0.14 * f;
            var mouthY0 = r * 0.31;
            var parts = [];
            for (var side = -1; side <= 1; side += 2) {
              parts.push({
                kind: "eye",
                p: sphereFacePoint(side * gap * 0.5, faceY0, faceYaw, r),
              });
            }
            parts.push({
              kind: "mouth",
              p: sphereFacePoint(mouthX0, mouthY0, faceYaw, r),
            });
            parts.sort(function (a, b) { return a.p.zr - b.p.zr; });
            for (var pi = 0; pi < parts.length; pi++) {
              var part = parts[pi];
              var p = part.p;
              if (!p.visible || p.a < 0.03) continue;
              if (part.kind === "eye") {
                drawCapsuleEye(cx + p.x, cy + p.y, ew * p.sx, eh * p.sx, p.a, white);
              } else {
                ctx.save();
                ctx.globalAlpha *= p.a;
                drawMouth(cx + p.x, cy + p.y, r, 0, 0, bl, lm, speak, false, false, false, p.sx, true);
                ctx.restore();
              }
            }
            ctx.restore();
            return;
          }

          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          for (var side = -1; side <= 1; side += 2) {
            var ex = cx + sx + side * gap * 0.5;
            var ey = faceY + (happy ? r * 0.02 * f : sleepy ? r * 0.04 * f : 0);
            if (sleepy) {
              ctx.save();
              ctx.lineCap = "round";
              ctx.lineWidth = Math.max(1.5, r * 0.052 * f);
              ctx.strokeStyle = white ? "rgba(255,255,255,0.78)" : "rgba(12,22,48,0.85)";
              ctx.beginPath();
              ctx.moveTo(ex - ew * 0.42, ey + r * 0.01 * f);
              ctx.quadraticCurveTo(ex, ey - r * 0.015 * f, ex + ew * 0.42, ey + r * 0.012 * f);
              ctx.stroke();
              ctx.restore();
              continue;
            }
            if (happy && eyeBl > 0.82) {
              ctx.save();
              ctx.lineCap = "round";
              ctx.lineWidth = Math.max(1.4, r * 0.05 * f);
              ctx.strokeStyle = white ? "rgba(255,255,255,0.88)" : "rgba(12,22,48,0.9)";
              ctx.beginPath();
              ctx.arc(ex - side * ew * 0.15, ey, ew * 0.34, Math.PI * 1.08, Math.PI * 1.92);
              ctx.stroke();
              ctx.restore();
              continue;
            }

            var x = ex - ew / 2, y = ey - eh / 2;

            if (white) {
              ctx.save();
              roundRect(x - ew * 0.12, y - eh * 0.1, ew * 1.24, eh * 1.2, ew / 2);
              ctx.fillStyle = "rgba(140,180,255,0.28)"; ctx.fill(); ctx.restore();
              ctx.save();
              roundRect(x, y, ew, eh, ew / 2);
              var glow = ctx.createLinearGradient(x, y, x, y + eh);
              glow.addColorStop(0, "rgba(255,255,255,0.98)");
              glow.addColorStop(1, "rgba(210,230,255,0.82)");
              ctx.fillStyle = glow; ctx.fill(); ctx.restore();
            } else {
              ctx.save();
              roundRect(x - ew * 0.08, y - eh * 0.08, ew * 1.16, eh * 1.16, ew / 2);
              ctx.fillStyle = "rgba(2,6,18,0.35)"; ctx.fill(); ctx.restore();
              ctx.save();
              roundRect(x, y, ew, eh, ew / 2);
              var eg = ctx.createLinearGradient(x, y, x, y + eh);
              eg.addColorStop(0, "rgba(12,22,48,0.98)");
              eg.addColorStop(1, "rgba(6,12,30,0.95)");
              ctx.fillStyle = eg; ctx.fill(); ctx.restore();
            }
          }
          ctx.restore();

          drawMouth(cx, cy, r, lx, ly, bl, lm, speak, happy || moodId === "excited", chatty, sleepy);
          drawZzz(cx, cy, r, sec || 0, lm, sleepy);
        }

        function orbColors() {
          if (colorBlend <= 0.001) return BRAND;
          var shifted = paletteAt(mood.color);
          return {
            deep: lerpRgb(BRAND.deep, shifted.deep, colorBlend * 0.85),
            mid: lerpRgb(BRAND.mid, shifted.mid, colorBlend * 0.85),
            bright: lerpRgb(BRAND.bright, shifted.bright, colorBlend * 0.85),
            glow: lerpRgb(BRAND.glow, shifted.glow, colorBlend * 0.85),
          };
        }

        function orbLight(g, cx, cy, r, sec, alpha, col) {
          if (alpha <= 0) return;
          col = col || BRAND;
          g.save();
          g.globalAlpha = alpha;
          g.globalCompositeOperation = "source-over";

          var outer = g.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 2.5);
          outer.addColorStop(0, intense(col.bright, 0.34));
          outer.addColorStop(0.45, intense(col.mid, 0.2));
          outer.addColorStop(1, rgba(col.deep, 0));
          g.fillStyle = outer;
          g.beginPath(); g.arc(cx, cy, r * 2.5, 0, Math.PI * 2); g.fill();

          for (var i = 0; i < 6; i++) {
            var a = sec * (0.9 + i * 0.12) + i * 0.785;
            var fx = cx + Math.cos(a) * r * (0.28 + Math.sin(sec * 2.5 + i) * 0.16);
            var fy = cy + Math.sin(a) * r * (0.24 + Math.cos(sec * 1.8 + i) * 0.13) - r * 0.08;
            var fr = r * (1 + Math.sin(sec * 3 + i) * 0.22);
            var fl = g.createRadialGradient(fx, fy, 0, fx, fy, fr);
            fl.addColorStop(0, intense(col.glow, 0.62));
            fl.addColorStop(0.35, intense(col.bright, 0.42));
            fl.addColorStop(0.7, intense(col.mid, 0.22));
            fl.addColorStop(1, rgba(col.deep, 0));
            g.fillStyle = fl;
            g.beginPath(); g.arc(fx, fy, fr, 0, Math.PI * 2); g.fill();
          }

          var body = g.createRadialGradient(cx, cy - r * 0.12, r * 0.02, cx, cy, r * 1.25);
          body.addColorStop(0, intense(col.glow, 0.58));
          body.addColorStop(0.22, intense(col.bright, 0.46));
          body.addColorStop(0.45, intense(col.bright, 0.34));
          body.addColorStop(0.7, intense(col.mid, 0.22));
          body.addColorStop(1, rgba(col.deep, 0));
          g.fillStyle = body;
          g.beginPath(); g.arc(cx, cy, r * 1.25, 0, Math.PI * 2); g.fill();

          var core = g.createRadialGradient(cx, cy - r * 0.1, 0, cx, cy, r * 0.38);
          core.addColorStop(0, "rgba(220,235,255,0.52)");
          core.addColorStop(0.35, intense(col.glow, 0.32));
          core.addColorStop(0.65, intense(col.bright, 0.18));
          core.addColorStop(1, rgba(col.mid, 0));
          g.fillStyle = core;
          g.beginPath(); g.arc(cx, cy, r * 0.38, 0, Math.PI * 2); g.fill();

          var spec = g.createRadialGradient(cx + r * 0.18, cy - r * 0.28, 0, cx + r * 0.1, cy - r * 0.16, r * 0.38);
          spec.addColorStop(0, "rgba(255,255,255,0.28)");
          spec.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = spec;
          g.beginPath(); g.arc(cx + r * 0.1, cy - r * 0.16, r * 0.45, 0, Math.PI * 2); g.fill();
          g.restore();
        }

        function orbDark(g, cx, cy, r, sec, alpha, col) {
          if (alpha <= 0) return;
          col = col || BRAND;
          g.save();
          g.globalAlpha = alpha;
          g.globalCompositeOperation = "lighter";

          var halo = g.createRadialGradient(cx, cy, r * 0.1, cx, cy, r * 2.8);
          halo.addColorStop(0, intense(col.glow, 0.58));
          halo.addColorStop(0.35, intense(col.bright, 0.42));
          halo.addColorStop(0.65, intense(col.mid, 0.24));
          halo.addColorStop(1, rgba(col.deep, 0));
          g.fillStyle = halo;
          g.beginPath(); g.arc(cx, cy, r * 2.8, 0, Math.PI * 2); g.fill();

          for (var i = 0; i < 6; i++) {
            var a = sec * (0.9 + i * 0.12) + i * 0.785;
            var fx = cx + Math.cos(a) * r * (0.32 + Math.sin(sec * 2.5 + i) * 0.2);
            var fy = cy + Math.sin(a) * r * (0.28 + Math.cos(sec * 1.8 + i) * 0.15) - r * 0.06;
            var fr = r * (1.05 + Math.sin(sec * 3 + i) * 0.28);
            var fl = g.createRadialGradient(fx, fy, 0, fx, fy, fr);
            fl.addColorStop(0, intense(col.glow, 0.72));
            fl.addColorStop(0.4, intense(col.bright, 0.48));
            fl.addColorStop(0.75, intense(col.bright, 0.26));
            fl.addColorStop(1, rgba(col.deep, 0));
            g.fillStyle = fl;
            g.beginPath(); g.arc(fx, fy, fr, 0, Math.PI * 2); g.fill();
          }

          var body = g.createRadialGradient(cx, cy - r * 0.12, r * 0.02, cx, cy, r * 1.15);
          body.addColorStop(0, intense(col.glow, 0.82));
          body.addColorStop(0.35, intense(col.bright, 0.58));
          body.addColorStop(0.65, intense(col.mid, 0.32));
          body.addColorStop(1, rgba(col.deep, 0));
          g.fillStyle = body;
          g.beginPath(); g.arc(cx, cy, r * 1.15, 0, Math.PI * 2); g.fill();

          var core = g.createRadialGradient(cx, cy - r * 0.1, 0, cx, cy, r * 0.65);
          core.addColorStop(0, "rgba(255,255,255,0.98)");
          core.addColorStop(0.25, "rgba(220,240,255,0.75)");
          core.addColorStop(0.5, intense(col.glow, 0.58));
          core.addColorStop(0.75, intense(col.bright, 0.3));
          core.addColorStop(1, rgba(col.mid, 0));
          g.fillStyle = core;
          g.beginPath(); g.arc(cx, cy, r * 0.65, 0, Math.PI * 2); g.fill();

          var spec = g.createRadialGradient(cx + r * 0.22, cy - r * 0.32, 0, cx + r * 0.12, cy - r * 0.18, r * 0.55);
          spec.addColorStop(0, "rgba(255,255,255,0.95)");
          spec.addColorStop(0.4, "rgba(255,255,255,0.25)");
          spec.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = spec;
          g.beginPath(); g.arc(cx + r * 0.12, cy - r * 0.18, r * 0.55, 0, Math.PI * 2); g.fill();
          g.restore();
        }

        function drawOrb(cx, cy, r, sec, lm, col) {
          orbDark(ctx, cx, cy, r, sec, 1 - lm, col);
          orbLight(ctx, cx, cy, r, sec, lm, col);
        }

        function bubblePalette(white) {
          return {
            fill: white ? "rgba(246,239,225,0.96)" : "rgba(28,34,48,0.94)",
            fillSoft: white ? "rgba(255,252,247,0.98)" : "rgba(34,42,58,0.95)",
            stroke: white ? "rgba(74,114,230,0.28)" : "rgba(140,180,255,0.32)",
            shadow: white ? "rgba(40,40,40,0.08)" : "rgba(0,0,0,0.22)",
            ink: white ? "rgba(40,40,40,0.88)" : "rgba(230,235,245,0.94)",
            line: white ? "rgba(26,63,170,0.72)" : "rgba(188,214,255,0.88)",
            lineSoft: white ? "rgba(74,114,230,0.22)" : "rgba(140,180,255,0.18)",
          };
        }

        function prepareBubbleMetrics(sx, sy, r, text, pop, lm, lightMul) {
          lightMul = lightMul == null ? 1 : lightMul;
          var white = lm > 0.45;
          var alpha = Math.min(1, pop * 1.08) * lightMul;
          var fontSize = Math.max(11.5, Math.min(14.5, r * 0.4));
          ctx.font = "500 " + fontSize + "px DM Sans, system-ui, sans-serif";
          var tw = ctx.measureText(text).width;
          var padX = r * 0.42;
          var padY = r * 0.26;
          var boxW = tw + padX * 2;
          var boxH = fontSize * 1.38 + padY;
          var orbTop = sy - r * 0.92;
          var gapFromOrb = r * 1.18;
          var tailTipY = orbTop - gapFromOrb;
          var tailStem = r * 0.48;
          var bx = sx - boxW * 0.5;
          var by = tailTipY - tailStem - boxH - r * 0.22;
          var minTop = Math.min(W, H) * 0.07;
          if (by < minTop) by = minTop;
          var cx = bx + boxW * 0.5;
          var cy = by + boxH * 0.5;
          var tailBaseY = by + boxH;
          return {
            sx: sx, sy: sy, r: r, pop: pop, text: text, white: white, alpha: alpha,
            fontSize: fontSize, padX: padX, padY: padY, boxW: boxW, boxH: boxH, bx: bx, by: by,
            cx: cx, cy: cy, tailTipY: tailTipY, tailStem: tailStem,
            tailLen: tailBaseY - tailTipY,
            tailX: sx, tailBaseY: tailBaseY,
            scale: 0.88 + springPop(Math.min(1, pop)) * 0.12,
            pal: bubblePalette(white),
          };
        }

        function drawBubbleBody(m, rad, fill, stroke, lineW) {
          ctx.globalAlpha = m.alpha;
          ctx.fillStyle = fill;
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineW;
          ctx.beginPath();
          roundRect(m.bx, m.by, m.boxW, m.boxH, rad);
          ctx.fill();
          if (lineW > 0) ctx.stroke();
        }

        function drawBubbleTailTriangle(m, halfW, depth, fill, stroke, lineW) {
          var y0 = m.tailBaseY - 1;
          ctx.globalAlpha = m.alpha;
          ctx.fillStyle = fill;
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineW;
          ctx.beginPath();
          ctx.moveTo(m.tailX - halfW, y0);
          ctx.lineTo(m.tailX, y0 + depth);
          ctx.lineTo(m.tailX + halfW, y0);
          ctx.closePath();
          ctx.fill();
          if (lineW > 0) ctx.stroke();
        }

        function drawBubbleTailCurve(m, fill, stroke, lineW) {
          var p = m.pal;
          fill = fill || p.fill;
          var y0 = m.tailBaseY - 1;
          var midY = y0 + m.tailLen * 0.52;
          ctx.globalAlpha = m.alpha;
          ctx.fillStyle = fill;
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineW;
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(m.tailX - m.r * 0.09, y0);
          ctx.quadraticCurveTo(m.tailX, midY, m.tailX, m.tailTipY + m.r * 0.03);
          ctx.quadraticCurveTo(m.tailX, midY, m.tailX + m.r * 0.09, y0);
          ctx.closePath();
          ctx.fill();
          if (lineW > 0) ctx.stroke();
        }

        function drawBubbleStyleClassic(m) {
          var p = m.pal;
          var rad = Math.min(m.boxH * 0.42, m.r * 0.3);
          ctx.globalAlpha = m.alpha * 0.18;
          ctx.fillStyle = p.shadow;
          ctx.beginPath();
          roundRect(m.bx + 1, m.by + 2, m.boxW, m.boxH, rad);
          ctx.fill();
          var grad = ctx.createLinearGradient(m.bx, m.by, m.bx, m.by + m.boxH);
          grad.addColorStop(0, p.fillSoft);
          grad.addColorStop(1, p.fill);
          drawBubbleBody(m, rad, grad, p.stroke, Math.max(1, m.r * 0.022));
          drawBubbleTailCurve(m, p.fill, p.stroke, Math.max(1, m.r * 0.02));
        }

        function drawBubbleStyleSoft(m) {
          var p = m.pal;
          var rad = Math.min(m.boxH * 0.55, m.r * 0.38);
          ctx.globalAlpha = m.alpha * 0.12;
          ctx.fillStyle = p.shadow;
          ctx.beginPath();
          roundRect(m.bx, m.by + 2, m.boxW, m.boxH, rad);
          ctx.fill();
          drawBubbleBody(m, rad, p.fillSoft, p.stroke, Math.max(0.9, m.r * 0.018));
          drawBubbleTailTriangle(m, m.r * 0.09, m.tailLen, p.fillSoft, p.stroke, Math.max(0.9, m.r * 0.018));
        }

        function drawBubbleStyleLine(m) {
          var p = m.pal;
          var rad = Math.min(m.boxH * 0.48, m.r * 0.34);
          var lw = Math.max(1.15, m.r * 0.023);
          var y0 = m.tailBaseY;
          var tipY = m.tailTipY;
          var sway = m.r * 0.05;

          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          ctx.globalAlpha = m.alpha * 0.35;
          ctx.strokeStyle = p.lineSoft;
          ctx.lineWidth = lw * 2.6;
          ctx.beginPath();
          roundRect(m.bx, m.by, m.boxW, m.boxH, rad);
          ctx.stroke();

          ctx.globalAlpha = m.alpha * 0.9;
          ctx.strokeStyle = p.line;
          ctx.lineWidth = lw;
          ctx.beginPath();
          roundRect(m.bx, m.by, m.boxW, m.boxH, rad);
          ctx.stroke();

          ctx.globalAlpha = m.alpha * 0.28;
          ctx.lineWidth = lw * 2.2;
          ctx.beginPath();
          ctx.moveTo(m.tailX, y0 + 1);
          ctx.bezierCurveTo(
            m.tailX + sway, y0 + m.tailLen * 0.38,
            m.tailX - sway * 0.4, y0 + m.tailLen * 0.72,
            m.tailX, tipY,
          );
          ctx.stroke();

          ctx.globalAlpha = m.alpha * 0.92;
          ctx.lineWidth = lw;
          ctx.beginPath();
          ctx.moveTo(m.tailX, y0 + 1);
          ctx.bezierCurveTo(
            m.tailX + sway, y0 + m.tailLen * 0.38,
            m.tailX - sway * 0.4, y0 + m.tailLen * 0.72,
            m.tailX, tipY,
          );
          ctx.stroke();

          ctx.globalAlpha = m.alpha * 0.55;
          ctx.fillStyle = p.line;
          ctx.beginPath();
          ctx.arc(m.tailX, y0 + 1, lw * 0.55, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalAlpha = m.alpha * 0.88;
          ctx.beginPath();
          ctx.arc(m.tailX, tipY, lw * 0.72, 0, Math.PI * 2);
          ctx.fill();
        }

        function drawBubbleText(m, animated, inkOverride) {
          var tx = m.bx + m.padX;
          var ty = m.by + m.padY + m.fontSize * 0.95;
          ctx.fillStyle = inkOverride || m.pal.ink;
          if (!animated) {
            ctx.globalAlpha = m.alpha * smoothstep(0.15, 0.55, m.pop);
            ctx.fillText(m.text, tx, ty);
            return;
          }
          var reveal = smoothstep(0.12, 0.75, m.pop);
          var len = m.text.length;
          for (var i = 0; i < len; i++) {
            var charT = reveal * (len + 0.4) - i;
            var ca = smoothstep(0, 0.65, charT);
            ctx.globalAlpha = m.alpha * ca;
            ctx.fillText(m.text[i], tx, ty);
            tx += ctx.measureText(m.text[i]).width;
          }
        }

        function drawSpeechBubble(sx, sy, r, lm, sec, lightMul) {
          if (!bubble.active || !bubble.text || bubble.show <= 0.01) return;
          var pop = bubble.show;
          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          var m = prepareBubbleMetrics(sx, sy, r, bubble.text, pop, lm, lightMul);
          ctx.translate(m.cx, m.cy);
          ctx.scale(m.scale, m.scale);
          ctx.translate(-m.cx, -m.cy);
          if (bubbleStyle === 1) drawBubbleStyleSoft(m);
          else if (bubbleStyle === 2) drawBubbleStyleLine(m);
          else drawBubbleStyleClassic(m);
          drawBubbleText(m, bubbleStyle === 0, bubbleStyle === 2 ? m.pal.line : null);
          ctx.restore();
        }

        function drawWindSwirls(cx, cy, r, angle, intensity, sec, lm, col, spinVel) {
          if (intensity < 0.04) return;
          col = col || BRAND;
          spinVel = spinVel || 0;
          var dir = spinVel >= 0 ? 1 : -1;
          var streaks = 6 + Math.floor(intensity * 16);
          var white = lm > 0.45;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.globalCompositeOperation = white ? "source-over" : "lighter";
          for (var i = 0; i < streaks; i++) {
            var t = i / streaks;
            var band = i % 3;
            var orbitR = r * (1.0 + band * 0.14 + t * 0.42);
            var orbitAng = angle + t * Math.PI * 2 * dir + sec * intensity * 3.2 * dir;
            var arcLen = 0.35 + intensity * (0.55 + band * 0.12);
            var startA = orbitAng - arcLen * 0.5;
            ctx.save();
            ctx.globalAlpha = intensity * (0.22 + (1 - t) * 0.28) * (0.7 + band * 0.12);
            ctx.strokeStyle = white ? intense(col.bright, 0.45 + intensity * 0.3) : intense(col.glow, 0.55 + intensity * 0.22);
            ctx.lineWidth = Math.max(0.9, r * (0.022 + intensity * 0.038) * (1.1 - band * 0.18));
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.arc(0, 0, orbitR, startA, startA + arcLen * dir);
            ctx.stroke();
            ctx.restore();
          }
          ctx.restore();
        }

        function trailCatmull(p0, p1, p2, p3, t) {
          var t2 = t * t;
          var t3 = t2 * t;
          return {
            x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
            y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
          };
        }

        function trailSmoothSamples(points, count) {
          var n = points.length;
          if (n < 2) return [];
          var out = [];
          var last = count - 1;
          for (var s = 0; s < count; s++) {
            var u = s / last;
            var f = u * (n - 1);
            var i = Math.min(n - 2, Math.floor(f));
            var t = f - i;
            var p0 = points[Math.max(0, i - 1)];
            var p1 = points[i];
            var p2 = points[Math.min(n - 1, i + 1)];
            var p3 = points[Math.min(n - 1, i + 2)];
            var pt = trailCatmull(p0, p1, p2, p3, t);
            out.push({ x: pt.x, y: pt.y, u: u });
          }
          return out;
        }

        function trailArcInsert(nx, ny, lm, r, running, sp) {
          if (!running || trail.length < 2) return [{ x: nx, y: ny, lm: lm }];
          if (sp < RUN_SPEED * 0.22) return [{ x: nx, y: ny, lm: lm }];
          var p0 = trail[0];
          var p1 = trail[1];
          var v1x = p0.x - p1.x;
          var v1y = p0.y - p1.y;
          var v2x = nx - p0.x;
          var v2y = ny - p0.y;
          var l1 = Math.hypot(v1x, v1y) || 1;
          var l2 = Math.hypot(v2x, v2y) || 1;
          var dot = (v1x / l1) * (v2x / l2) + (v1y / l1) * (v2y / l2);
          if (dot > 0.9 || l2 < 3.5) return [{ x: nx, y: ny, lm: lm }];
          var px = -v1y / l1;
          var py = v1x / l1;
          var bulge = r * 0.14 * (1 - dot);
          var steps = 2 + Math.floor((1 - dot) * 3);
          var pts = [];
          for (var k = steps; k >= 0; k--) {
            var t = k / steps;
            var bx = p0.x + (nx - p0.x) * t;
            var by = p0.y + (ny - p0.y) * t;
            var bend = Math.sin(t * Math.PI) * bulge;
            pts.push({ x: bx + px * bend, y: by + py * bend, lm: lm });
          }
          return pts;
        }

        function drawTrail(cx, cy, r, lm, col, boost, lightMul, running, dt) {
          col = col || BRAND;
          boost = boost || 0;
          lightMul = lightMul == null ? 1 : lightMul;
          dt = dt || 0.016;
          running = running > 0;
          var trailMax = running ? 88 : TRAIL;
          var moving = boost > 0.12;
          var white = lm > 0.45;

          if (moving) {
            trailIdle = 0;
            trailPhase += dt * (running ? 9 : 6);
            var sp = Math.hypot(velX, velY);
            var nx = sp > 0.5 ? velX / sp : 0;
            var ny = sp > 0.5 ? velY / sp : 0;
            var px = -ny;
            var py = nx;
            var wobMin = running ? RUN_SPEED * 0.25 : 35;
            var wob = sp > wobMin ? Math.sin(trailPhase) * r * (running ? 0.07 : 0.045) : 0;
            var wx = cx + px * wob;
            var wy = cy + py * wob;
            if (!trail.length || Math.hypot(wx - trail[0].x, wy - trail[0].y) > 2.5) {
              var inserts = trailArcInsert(wx, wy, lm, r, running, sp);
              for (var ins = 0; ins < inserts.length; ins++) {
                trail.unshift(inserts[ins]);
              }
            }
          } else if (trail.length > 1) {
            trailIdle += dt;
            if (trailIdle > 0.045) {
              trail.pop();
              trailIdle = 0;
            }
          }
          if (trail.length > trailMax) trail.length = trailMax;

          var n = trail.length;
          if (n < 2) return;

          var sampleCount = running
            ? Math.min(96, Math.max(32, n * 3))
            : Math.min(56, Math.max(16, n * 2));
          var samples = trailSmoothSamples(trail, sampleCount);
          if (samples.length < 2) return;

          ctx.save();
          ctx.globalCompositeOperation = white ? "source-over" : "lighter";
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          if (moving) {
            var headR = r * (running ? 1.42 : 1.18);
            var headG = ctx.createRadialGradient(cx, cy, 0, cx, cy, headR);
            headG.addColorStop(0, rgba(col.glow, (running ? 0.48 : 0.36) * lightMul));
            headG.addColorStop(0.35, rgba(col.bright, (running ? 0.28 : 0.2) * lightMul));
            headG.addColorStop(0.72, rgba(col.mid, (running ? 0.1 : 0.07) * lightMul));
            headG.addColorStop(1, rgba(col.deep, 0));
            ctx.fillStyle = headG;
            ctx.beginPath();
            ctx.arc(cx, cy, headR, 0, Math.PI * 2);
            ctx.fill();
          }

          for (var i = 0; i < samples.length - 1; i++) {
            var a = samples[i];
            var b = samples[i + 1];
            var near = 1 - a.u;
            var w = r * (0.08 + near * near * (running ? 1.18 : 0.82));
            var alpha = (0.1 + near * near * near * (running ? 0.46 : 0.32)) * lightMul;
            if (alpha < 0.01) continue;
            ctx.strokeStyle = rgba(col.glow, alpha * 0.48);
            ctx.lineWidth = w;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }

          for (var j = 0; j < samples.length - 1; j++) {
            var c = samples[j];
            var d = samples[j + 1];
            var near2 = 1 - c.u;
            var w2 = r * (0.025 + near2 * near2 * (running ? 0.42 : 0.28));
            var alpha2 = (0.14 + near2 * near2 * (running ? 0.82 : 0.55)) * lightMul;
            if (alpha2 < 0.012) continue;
            ctx.strokeStyle = white
              ? "rgba(255,255,255," + alpha2 + ")"
              : rgba(col.bright, alpha2);
            ctx.lineWidth = w2;
            ctx.beginPath();
            ctx.moveTo(c.x, c.y);
            ctx.lineTo(d.x, d.y);
            ctx.stroke();
          }

          if (running && n > 5) {
            var tail = samples[samples.length - 1];
            var prev = samples[Math.max(0, samples.length - 4)];
            var tdx = tail.x - prev.x;
            var tdy = tail.y - prev.y;
            var td = Math.hypot(tdx, tdy) || 1;
            var tpx = -tdy / td;
            var tpy = tdx / td;
            for (var s = 0; s < 5; s++) {
              var spread = (s / 5) * r * 0.5;
              var sparkle = (0.5 - s * 0.08) * lightMul;
              ctx.fillStyle = white
                ? "rgba(255,255,255," + sparkle + ")"
                : rgba(col.glow, sparkle);
              ctx.beginPath();
              ctx.arc(
                tail.x + tpx * spread,
                tail.y + tpy * spread,
                Math.max(0.35, r * (0.016 - s * 0.0016)),
                0, Math.PI * 2,
              );
              ctx.fill();
            }
          }

          ctx.restore();
        }

        function moveEaseForMood() {
          if (mood.id === "spin") return 0.65;
          if (mood.id === "sleepy") return 0.9;
          if (mood.id === "float") return 1.05;
          if (mood.id === "shy") return 1;
          return 1.25;
        }

        function stepToward(dx, dy, ease, dt) {
          var stepX = dx * ease;
          var stepY = dy * ease;
          var len = Math.hypot(stepX, stepY);
          var cap = MAX_SPEED * dt;
          if (len > cap && len > 0) {
            stepX = stepX / len * cap;
            stepY = stepY / len * cap;
          }
          return { x: stepX, y: stepY };
        }

        function steerHeading(curNx, curNy, desNx, desNy, dt, maxTurnRate) {
          var dot = Math.max(-1, Math.min(1, curNx * desNx + curNy * desNy));
          var cross = curNx * desNy - curNy * desNx;
          var angle = Math.atan2(cross, dot);
          var turn = Math.max(-maxTurnRate * dt, Math.min(maxTurnRate * dt, angle));
          var c = Math.cos(turn);
          var s = Math.sin(turn);
          return { x: curNx * c - curNy * s, y: curNx * s + curNy * c };
        }

        function moveTowardTarget(dx, dy, dist, dt, running) {
          if (dist < 2) {
            moveVelX *= 0.7;
            moveVelY *= 0.7;
            return { x: moveVelX * dt, y: moveVelY * dt };
          }
          var desNx = dx / dist;
          var desNy = dy / dist;
          var cruise = running ? RUN_SPEED : GO_SPEED;
          var arrive = running ? 22 : 18;
          var speedMul = dist > arrive ? 1 : smoothstep(0, arrive, dist) * 0.35 + 0.12;
          var targetSpeed = cruise * speedMul;
          var curSp = Math.hypot(moveVelX, moveVelY);
          var curNx = curSp > 10 ? moveVelX / curSp : desNx;
          var curNy = curSp > 10 ? moveVelY / curSp : desNy;
          var turnRate = running ? (curSp > RUN_SPEED * 0.35 ? 4.8 : 7.5) : 5.5;
          var head = steerHeading(curNx, curNy, desNx, desNy, dt, turnRate);
          var targetVx = head.x * targetSpeed;
          var targetVy = head.y * targetSpeed;
          var accel = running ? 16 : 14;
          moveVelX += (targetVx - moveVelX) * Math.min(1, accel * dt);
          moveVelY += (targetVy - moveVelY) * Math.min(1, accel * dt);
          return { x: moveVelX * dt, y: moveVelY * dt };
        }

        function update(now) {
          var sec = now * 0.001;
          var dt = lastNow ? Math.min((now - lastNow) / 1000, 0.05) : 0.016;
          lastNow = now;
          if (userOverride > 0) {
            userOverride -= dt;
            if (Math.hypot(targetX - orbX, targetY - orbY) > 18) {
              userOverride = Math.max(userOverride, 1.8);
            }
          }

          if (depart.active) {
            depart.t += dt;
            if (depart.t >= depart.dur) finishDepart(sec);
          } else if (sec >= wander.nextPick) {
            pickWanderTarget(sec, true, false);
          }

          var aimX = userOverride > 0 ? targetX : (depart.active ? orbX : wander.x);
          var aimY = userOverride > 0 ? targetY : (depart.active ? orbY : wander.y);
          if (mood.id === "float") {
            aimX += Math.sin(sec * 0.28) * W * 0.025;
            aimY += Math.cos(sec * 0.24) * H * 0.02;
          } else if (mood.id === "curious") {
            aimX += Math.sin(sec * 0.32 + 1.2) * 10;
            aimY += Math.cos(sec * 0.28) * 8;
          } else if (mood.id === "shy") {
            var cx = W * 0.5, cy = H * 0.5;
            aimX = lerp(aimX, cx + (orbX - cx) * 1.03, 0.015);
            aimY = lerp(aimY, cy + (orbY - cy) * 1.03, 0.015);
          } else if (mood.id === "spin") {
            aimX = lerp(aimX, orbX, 0.08);
            aimY = lerp(aimY, orbY, 0.08);
          }

          var boundR = Math.min(W, H) * 0.042 * 0.6 * 0.7 * zoom.level;
          var bounds = orbBounds(boundR);
          aimX = Math.max(bounds.minX, Math.min(bounds.maxX, aimX));
          aimY = Math.max(bounds.minY, Math.min(bounds.maxY, aimY));

          var dx = aimX - orbX, dy = aimY - orbY;
          var dist = Math.hypot(dx, dy);
          if (userOverride > 0 && dist > 2) {
            var step = moveTowardTarget(dx, dy, dist, dt, happyRun > 0);
            orbX += step.x;
            orbY += step.y;
            velX = moveVelX;
            velY = moveVelY;
          } else if (dist > 2) {
            var ease = 1 - Math.exp(-moveEaseForMood() * dt);
            var step = stepToward(dx, dy, ease, dt);
            orbX += step.x;
            orbY += step.y;
            velX = step.x / Math.max(dt, 0.001);
            velY = step.y / Math.max(dt, 0.001);
            moveVelX = velX;
            moveVelY = velY;
          } else {
            orbX += Math.sin(sec * 0.45) * 0.15;
            orbY += Math.sin(sec * 0.55) * 0.12;
            velX *= 0.75;
            velY *= 0.75;
            moveVelX *= 0.75;
            moveVelY *= 0.75;
          }

          clampOrbPos(boundR);
          targetX = Math.max(bounds.minX, Math.min(bounds.maxX, targetX));
          targetY = Math.max(bounds.minY, Math.min(bounds.maxY, targetY));
          wander.x = Math.max(bounds.minX, Math.min(bounds.maxX, wander.x));
          wander.y = Math.max(bounds.minY, Math.min(bounds.maxY, wander.y));

          var sp = Math.hypot(velX, velY);
          if (happyRun > 0 && dist < 8 && sp < 90) happyRun = 0;
          var targetLX = 0;
          var targetLY = 0;
          if (mood.id === "curious") {
            targetLX = Math.sin(sec * 0.75) * 0.48;
            targetLY = Math.cos(sec * 0.55) * 0.18;
          } else if (mood.id === "sleepy") {
            targetLX = Math.sin(sec * 0.08) * 0.06;
            targetLY = 0.18;
          } else if (mood.id === "chatty") {
            targetLX = Math.sin(sec * 1.2) * 0.2;
            targetLY = Math.cos(sec * 1.5) * 0.08;
          } else if (mood.id === "shy") {
            targetLX = 0.42;
            targetLY = 0.1;
          } else if (mood.id === "spin" && mood.spinFast > 0.25) {
            targetLX = 0;
            targetLY = 0;
          } else if (mood.id === "spin") {
            targetLX = Math.sin(sec * 0.7) * 0.18;
            targetLY = Math.cos(sec * 0.55) * 0.08;
          } else if (sp > 2) {
            targetLX = (velX / sp) * Math.min(0.55, sp * 0.018);
            targetLY = (velY / sp) * Math.min(0.28, sp * 0.012);
          } else {
            var lr = Math.sin(sec * 0.19);
            targetLX = lr * smoothstep(-0.1, 0.88, Math.abs(lr)) * 0.28;
            targetLY = Math.sin(sec * 0.27) * 0.06;
          }
          var lookEase = 1 - Math.exp(-8 * dt);
          smoothLX += (targetLX - smoothLX) * lookEase;
          smoothLY += (targetLY - smoothLY) * lookEase;
          lookX = smoothLX;
          lookY = smoothLY;

          updateMood(dt, sec);

          presenceThink(dt, sec);

          var speakWave = Math.sin(sec * (mood.id === "chatty" ? 11 : mood.id === "happy" || mood.id === "excited" ? 8 : 6)) * 0.5 + 0.5;
          var speakBurst = mood.id === "chatty" ? Math.max(0, Math.sin(sec * 11 + 0.5)) : 0;
          var speakTarget = mood.id === "chatty"
            ? 0.45 + speakWave * 0.52 + speakBurst * 0.2
            : mood.id === "sleepy"
              ? 0.12 + speakWave * 0.1
              : mood.id === "spin" && mood.spinFast > 0.3
                ? 0.28 + speakWave * 0.35
                : 0.18 + speakWave * 0.28;
          if (bubble.active && bubble.show > 0.28) {
            speakTarget = Math.max(speakTarget, 0.32 + speakWave * 0.38);
          }
          mouthOpen += (speakTarget - mouthOpen) * Math.min(1, dt * (mood.id === "chatty" || bubble.active ? 14 : 8));

          if (userOverride > 0 && dist < 14 && sp < 50) {
            if (!presence.atDest && sec - presence.lastArrive > 2.5 && Math.random() < 0.42) {
              sayBubble(pickSpeechLine("arrive"));
              presence.lastArrive = sec;
            }
            presence.atDest = true;
          } else {
            presence.atDest = false;
          }

          var blinkVal = blink(sec);
          if (mood.id !== "sleepy" && !depart.active) {
            blinkVal = Math.max(blinkVal, MIN_EYE);
          }
          if (mood.id === "sleepy") blinkVal = 0.35 + Math.abs(Math.sin(sec * 0.38)) * 0.35;
          var lightMul = 1;
          if (depart.active) {
            var dp = depart.t / depart.dur;
            lightMul = departLight(dp);
            if (dp < 0.72) {
              var flicker = 0.65 + Math.sin(depart.t * 48) * 0.35;
              blinkVal = Math.max(MIN_EYE, Math.min(1, blinkVal * flicker));
              if (stateTag) stateTag.textContent = "sin luz…";
            } else if (stateTag) stateTag.textContent = MOOD_LABEL[mood.id] || mood.id;
          }

          return {
            sec: sec,
            dt: dt,
            breathe: 1 + Math.sin(sec * 0.65) * 0.03,
            blink: blinkVal,
            r: Math.min(W, H) * 0.042 * 0.6 * 0.7 * zoom.level,
            lm: themeLm(),
            speak: mouthOpen,
            col: orbColors(),
            spinFast: mood.spinFast,
            lightMul: lightMul,
            moveBoost: Math.min(1, sp / (happyRun > 0 ? RUN_SPEED : GO_SPEED)),
            happyRun: happyRun,
          };
        }

        function frame(now) {
          var st = update(now);
          var r = st.r * st.breathe * mood.shrink;
          lastOrbR = r;
          var drawX = orbX + mood.wiggleX;
          var drawY = orbY - mood.bounce * st.r;
          var lm = st.lm;
          var spinning = mood.id === "spin";
          var faceLookX = lookX;
          var faceLookY = lookY;

          drawBackground();

          drawTrail(drawX, drawY, r, lm, st.col, st.moveBoost, st.lightMul, st.happyRun, st.dt);
          if (spinning) {
            drawWindSwirls(drawX, drawY, r, mood.spinAngle, st.spinFast, st.sec, lm, st.col, mood.spinVel);
          }

          ctx.save();
          ctx.translate(drawX, drawY);
          ctx.scale(1, mood.squash);
          ctx.globalAlpha = st.lightMul;
          drawOrb(0, 0, r, st.sec, lm, st.col);
          if (spinning) {
            drawSpinFaceTrail(0, 0, r, mood.spinAngle, mood.spinVel, lm, st.blink, st.speak, st.sec, st.col, st.lightMul);
            drawFace(0, 0, r, 0, 0, st.blink, lm, st.speak, mood.id, st.sec, mood.spinAngle);
          } else {
            drawFace(0, 0, r, faceLookX, faceLookY, st.blink, lm, st.speak, mood.id, st.sec, null);
          }
          ctx.restore();

          drawSpeechBubble(drawX, drawY, r, lm, st.sec, st.lightMul);

          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        var THEME_KEY = "smalletters-theme";
        var root = document.documentElement;
        var themeToggle = document.getElementById("theme-toggle");
        var themeIcon = document.getElementById("theme-icon");

        function swapIconContent(el, html, animate) {
          if (!animate) { el.innerHTML = html; return; }
          el.classList.add("icon-swap");
          window.setTimeout(function () {
            el.innerHTML = html;
            el.classList.remove("icon-swap");
          }, 220);
        }

        function applyTheme(theme, persist) {
          if (theme === "night") {
            root.setAttribute("data-theme", "night");
            themeToggle.setAttribute("aria-pressed", "true");
            themeToggle.setAttribute("aria-label", "Cambiar a modo día");
            swapIconContent(themeIcon, '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.6 6.6 0 0 0 10.5 10.5Z" />', persist);
          } else {
            root.removeAttribute("data-theme");
            themeToggle.setAttribute("aria-pressed", "false");
            themeToggle.setAttribute("aria-label", "Cambiar a modo noche");
            swapIconContent(
              themeIcon,
              '<circle cx="12" cy="12" r="4.2" /><path d="M12 3v2M12 19v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M3 12h2M19 12h2M4.6 19.4l1.4-1.4M18 6l1.4-1.4" />',
              persist,
            );
          }
          if (persist) {
            try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
          }
          invalidateBackground();
        }

        (function initTheme() {
          var saved = null;
          try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
          var prefersNight = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          applyTheme(saved || (prefersNight ? "night" : "day"), false);
        })();

        themeToggle.addEventListener("click", function () {
          var isNight = root.getAttribute("data-theme") === "night";
          applyTheme(isNight ? "day" : "night", true);
        });

        var zoomInBtn = document.getElementById("zoom-in");
        var zoomOutBtn = document.getElementById("zoom-out");
        var zoomLabel = document.getElementById("zoom-label");

        function updateZoomUi() {
          if (zoomLabel) zoomLabel.textContent = Math.round(zoom.level * 100) + "%";
          if (zoomInBtn) zoomInBtn.disabled = zoom.index >= ZOOM_LEVELS.length - 1;
          if (zoomOutBtn) zoomOutBtn.disabled = zoom.index <= 0;
        }

        function setZoomIndex(idx, persist) {
          zoom.index = Math.max(0, Math.min(ZOOM_LEVELS.length - 1, idx));
          zoom.level = ZOOM_LEVELS[zoom.index];
          updateZoomUi();
          if (persist) {
            try { localStorage.setItem(ZOOM_KEY, String(zoom.index)); } catch (e) {}
          }
        }

        if (zoomInBtn) {
          zoomInBtn.addEventListener("click", function () {
            setZoomIndex(zoom.index + 1, true);
          });
        }
        if (zoomOutBtn) {
          zoomOutBtn.addEventListener("click", function () {
            setZoomIndex(zoom.index - 1, true);
          });
        }

        (function initZoom() {
          var saved = 1;
          try {
            var raw = localStorage.getItem(ZOOM_KEY);
            if (raw != null) saved = parseInt(raw, 10);
          } catch (e) {}
          if (isNaN(saved) || saved < 0 || saved >= ZOOM_LEVELS.length) saved = 1;
          setZoomIndex(saved, false);
        })();
      })();
    </script>
  </body>
</html>
